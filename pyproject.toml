[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clipo-ai"
version = "1.0.0"
description = "Autonomous AI-Powered Viral Shorts & Video Clipping Studio"
readme = "README.md"
authors = [{ name = "Dhruv" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "groq>=1.7.0",
    "moviepy>=2.2.1",
    "yt-dlp>=2026.10.26",
    "openai-whisper>=20250625",
    "python-dotenv>=1.2.3",
    "streamlit>=1.65.0",
    "numpy>=1.25.0",
    "pillow>=11.0.0",
]

[project.scripts]
clipo = "cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

